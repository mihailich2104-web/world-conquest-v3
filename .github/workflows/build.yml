name: Build EXE
on:
  push:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: WorldConquest-Windows
            path: dist/WorldConquest.exe
          - os: ubuntu-latest
            name: WorldConquest-Linux
            path: dist/WorldConquest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: SDL-зависимости (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0
      - run: python -m pip install --upgrade pip
      - name: Зависимости (только pygame-ce, без обычного pygame)
        shell: bash
        run: |
          pip uninstall -y pygame || true
          pip install -r requirements.txt
          pip uninstall -y pygame || true
          pip install --force-reinstall --no-deps pygame-ce==2.5.2
          python -c "import pygame, pygame_gui; from pygame import DIRECTION_LTR; print('pygame', pygame.version.ver, pygame.IS_CE)"
      - name: Карта мира (Natural Earth 50m; при ошибке — запасная 110m из проекта)
        run: python tools/prepare_map.py --force
      - run: python tools/gen_countries.py
      - name: Регионы (провинции) из карты — центры зафиксированы в region_seeds.json
        run: python tools/make_regions.py
      - run: python tools/build_scenarios.py
      - run: python tools/check_names.py
      - run: pip install pillow
      - name: tests/test_geom.py
        run: python tests/test_geom.py
        continue-on-error: true
      - name: tests/test_render.py
        run: python tests/test_render.py
        continue-on-error: true
      - name: tests/test_armies.py
        run: python tests/test_armies.py
        continue-on-error: true
      - name: tests/test_scenarios.py
        run: python tests/test_scenarios.py
        continue-on-error: true
      - name: tests/test_core.py
        run: python tests/test_core.py
        continue-on-error: true
      - name: tests/test_tutorial.py
        run: python tests/test_tutorial.py
        continue-on-error: true
      - name: tests/test_features.py
        run: python tests/test_features.py
        continue-on-error: true
      - name: tests/test_map_geo.py
        run: python tests/test_map_geo.py
        continue-on-error: true
      - name: Тест LAN (сокеты на localhost)
        run: python tests/test_lan.py
        continue-on-error: ${{ runner.os == 'Windows' }}
      - name: Дымовой тест UI (без окна)
        run: python tests/test_smoke_ui.py
        continue-on-error: true
      - run: pyinstaller build/world_conquest.spec --clean --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
      - name: Установщик (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WC_ONEDIR = "1"
          python -m PyInstaller build/world_conquest.spec --clean --noconfirm
          if (-not (Test-Path dist/WorldConquest/WorldConquest.exe)) { throw "onedir не собран" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          if (-not (Test-Path installer/WorldConquest-Setup.exe)) { throw "установщик не собран" }
      - name: Артефакт установщика
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WorldConquest-Setup
          path: installer/WorldConquest-Setup.exe
      - name: Карта мира как артефакт (для Termux/других сборок)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: world-data
          path: src/data/provinces.geojson
