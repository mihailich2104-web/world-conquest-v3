name: Build EXE
on:
  push:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: WorldConquest-Windows
            path: dist/WorldConquest.exe
          - os: ubuntu-latest
            name: WorldConquest-Linux
            path: dist/WorldConquest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: SDL-зависимости (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Карта мира (Natural Earth 50m; при ошибке — запасная 110m из проекта)
        run: python tools/prepare_map.py --force
      - run: python tools/gen_countries.py
      - run: python tests/test_core.py
      - run: python tests/test_tutorial.py
      - run: python tests/test_features.py
      - run: python tests/test_map_geo.py
      - name: Тест LAN (сокеты на localhost)
        run: python tests/test_lan.py
        continue-on-error: ${{ runner.os == 'Windows' }}
      - name: Дымовой тест UI (без окна)
        run: python tests/test_smoke_ui.py
      - run: pyinstaller build/world_conquest.spec --clean --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
      - name: Карта мира как артефакт (для Termux/других сборок)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: world-data
          path: src/data/provinces.geojson

      - name: Установщик (Inno Setup)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Загрузка установщика
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WorldConquest-Setup
          path: installer/WorldConquest-Setup.exe
